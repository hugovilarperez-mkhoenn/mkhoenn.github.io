<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - Mi Perfil</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 240px; background-color: #1a1a1a; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #2a2a2a; }
        .sidebar-top { padding: 20px; }
        .sidebar h2 { font-size: 1.1em; color: #e3350d; margin-top: 0; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        .nav-links { display: flex; flex-direction: column; gap: 8px; }
        .nav-link { display: flex; align-items: center; gap: 10px; padding: 12px 15px; color: #aaa; text-decoration: none; border-radius: 6px; font-weight: bold; transition: all 0.2s; }
        .nav-link:hover { background-color: #2a2a2a; color: white; }
        .nav-link.active { background-color: #e3350d; color: white; }
        .sidebar-bottom { padding: 20px; border-top: 1px solid #2a2a2a; display: flex; flex-direction: column; gap: 8px; }
        
        .main-content { flex: 1; overflow-y: auto; padding: 30px; display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; justify-content: center; }
        .card { background-color: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 500px; }
        
        label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: bold; font-size: 0.85em; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 6px; box-sizing: border-box; background-color: #2a2a2a; color: white; font-family: inherit; transition: border-color 0.3s; }
        input:focus { outline: none; border-color: #e3350d; }
        
        button { width: 100%; padding: 12px; background-color: #e3350d; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px; transition: background-color 0.2s; }
        button:hover { background-color: #b32a0a; }
        .btn-logout { width: 100%; background-color: #333; padding: 10px; font-size: 0.85em; border: none; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; text-align: center; text-decoration: none; }
        .btn-logout:hover { background-color: #444; }

        .avatar-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
        .avatar-preview { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #e3350d; background-color: #2a2a2a; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; font-size: 2.5em; color: #555; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-top">
            <h2>Panel TCG</h2>
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">📊 Partidas</a>
                <a href="torneos.html" class="nav-link">🏆 Torneos</a>
                <a href="equipo.html" class="nav-link">👥 Miembros</a>
            </div>
        </div>
        <div class="sidebar-bottom">
            <a href="perfil.html" class="nav-link active" style="padding: 10px 15px; background-color: #e3350d; border-radius: 6px; color: white; text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 10px;">⚙️ Mi Perfil</a>
            <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </div>

    <div class="main-content">
        <div class="card">
            <h3 style="margin-top:0; text-align: center;">Configuración de Perfil</h3>
            
            <div class="avatar-container">
                <div id="avatar-wrapper">
                    <img id="avatar-img" class="avatar-preview" src="" alt="Avatar" style="display: none;">
                    <div id="avatar-placeholder" class="avatar-preview">👤</div>
                </div>
            </div>

            <form id="formPerfil">
                <label for="email_usuario">Correo Electrónico</label>
                <input type="text" id="email_usuario" disabled style="color: #777; cursor: not-allowed;">

                <label for="nombre_usuario">Nombre de Usuario / Nick</label>
                <input type="text" id="nombre_usuario" placeholder="Ej: Ash Ketchum" required autocomplete="off">

                <label for="avatar_file">Foto de Perfil (Imagen)</label>
                <input type="file" id="avatar_file" accept="image/*">

                <button type="submit" id="btn-guardar">Guardar Cambios</button>
                <div id="mensajePerfil" style="margin-top:15px; text-align:center; font-size:0.9em;"></div>
            </form>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://xacmsdklvvturxmabhcn.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhhY21zZGtsdnZ0dXJ4bWFiaGNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3ODY4ODQsImV4cCI6MjEwNDM2Mjg4NH0.Bq9whfVe5Ah7Kz8NUKWTu5lZqGZRzHZSk-5xy3sHmWQ';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let usuarioActual = null;

        async function comprobarAutenticacion() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { 
                window.location.href = "index.html"; 
            } else { 
                usuarioActual = user;
                cargarDatosPerfil();
            }
        }
        comprobarAutenticacion();

        async function cerrarSesion() {
            await supabaseClient.auth.signOut();
            window.location.href = "index.html";
        }

        async function cargarDatosPerfil() {
            document.getElementById('email_usuario').value = usuarioActual.email;

            // Buscar si ya tiene perfil creado
            const { data: perfil } = await supabaseClient
                .from('perfiles')
                .select('*')
                .eq('id', usuarioActual.id)
                .single();

            if (perfil) {
                if (perfil.nombre_usuario) {
                    document.getElementById('nombre_usuario').value = perfil.nombre_usuario;
                } else {
                    document.getElementById('nombre_usuario').value = usuarioActual.email.split('@')[0];
                }

                if (perfil.avatar_url) {
                    const img = document.getElementById('avatar-img');
                    const placeholder = document.getElementById('avatar-placeholder');
                    img.src = perfil.avatar_url;
                    img.style.display = 'block';
                    placeholder.style.display = 'none';
                }
            } else {
                document.getElementById('nombre_usuario').value = usuarioActual.email.split('@')[0];
            }
        }

        document.getElementById('formPerfil').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msg = document.getElementById('mensajePerfil');
            msg.style.color = "white";
            msg.innerText = "Guardando perfil...";

            const nuevoNombre = document.getElementById('nombre_usuario').value.trim();
            const fileInput = document.getElementById('avatar_file');
            let avatarUrlFinal = null;

            // Si ha seleccionado una imagen nueva, la subimos a Supabase Storage
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `${usuarioActual.id}-${Math.random()}.${fileExt}`;
                const filePath = `${fileName}`;

                const { error: uploadError } = await supabaseClient.storage
                    .from('perfiles')
                    .upload(filePath, file, { upsert: true });

                if (uploadError) {
                    msg.style.color = "#ff4d4d";
                    msg.innerText = "Error al subir la imagen.";
                    return;
                }

                // Obtener URL pública de la imagen
                const { data: publicUrlData } = supabaseClient.storage
                    .from('perfiles')
                    .getPublicUrl(filePath);

                avatarUrlFinal = publicUrlData.publicUrl;
            }

            // Datos a actualizar/insertar en la tabla perfiles
            const datosUpdate = {
                id: usuarioActual.id,
                nombre_usuario: nuevoNombre,
                actualizado_en: new Date()
            };

            if (avatarUrlFinal) {
                datosUpdate.avatar_url = avatarUrlFinal;
            }

            const { error } = await supabaseClient
                .from('perfiles')
                .upsert(datosUpdate, { onConflict: 'id' });

            if (error) {
                msg.style.color = "#ff4d4d";
                msg.innerText = "Error al actualizar el perfil.";
            } else {
                msg.style.color = "#4dff4d";
                msg.innerText = "¡Perfil actualizado con éxito!";
                if (avatarUrlFinal) {
                    const img = document.getElementById('avatar-img');
                    const placeholder = document.getElementById('avatar-placeholder');
                    img.src = avatarUrlFinal;
                    img.style.display = 'block';
                    placeholder.style.display = 'none';
                }
                setTimeout(() => msg.innerText = "", 3000);
            }
        });
    </script>
</body>
</html>
