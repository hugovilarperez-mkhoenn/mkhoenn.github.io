<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil y Torneos en Vivo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 240px; background-color: #1a1a1a; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #2a2a2a; }
        .sidebar-top { padding: 20px; }
        .sidebar h2 { font-size: 1.1em; color: #e3350d; margin-top: 0; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        .nav-links { display: flex; flex-direction: column; gap: 8px; }
        .nav-link { display: flex; align-items: center; gap: 10px; padding: 12px 15px; color: #aaa; text-decoration: none; border-radius: 6px; font-weight: bold; transition: all 0.2s; }
        .nav-link:hover { background-color: #2a2a2a; color: white; }
        .nav-link.active { background-color: #e3350d; color: white; }
        .sidebar-bottom { padding: 20px; border-top: 1px solid #2a2a2a; display: flex; flex-direction: column; gap: 8px; }
        
        .main-content { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 20px; }
        .card { background-color: #1e1e1e; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        button { padding: 10px 15px; background-color: #e3350d; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; font-size: 0.85em; transition: background-color 0.2s; }
        button:hover { background-color: #b32a0a; }
        .btn-logout { width: 100%; background-color: #333; padding: 10px; font-size: 0.85em; border: none; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; text-align: center; }
        .btn-logout:hover { background-color: #444; }

        input, select { width: 100%; padding: 10px; border: 1px solid #333; border-radius: 6px; box-sizing: border-box; background-color: #2a2a2a; color: white; font-family: inherit; }

        /* Cabecera del Perfil */
        .profile-header { display: flex; align-items: center; gap: 20px; background: #2a2a2a; padding: 20px; border-radius: 10px; border: 1px solid #333; }
        .avatar-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #e3350d; background: #333; display: flex; align-items: center; justify-content: center; font-size: 2em; }
        .profile-info h2 { margin: 0 0 5px 0; color: #fff; }
        .profile-info p { margin: 0; color: #aaa; font-size: 0.9em; }

        /* Subpestañas del perfil */
        .profile-tabs { display: flex; gap: 10px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .tab-btn { background: #2a2a2a; border: none; color: #aaa; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 0.85em; }
        .tab-btn.active { background: #e3350d; color: white; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Torneo en vivo card */
        .live-tournament-card { background: rgba(227, 53, 13, 0.1); border: 1px solid #e3350d; padding: 20px; border-radius: 8px; margin-bottom: 15px; }
        .badge-live { background-color: #e3350d; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.75em; font-weight: bold; text-transform: uppercase; }
        
        .palmares-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        .palmares-card { background: #2a2a2a; padding: 15px; border-radius: 8px; border: 1px solid #333; text-align: center; }
        .palmares-card h4 { margin: 0 0 5px 0; color: #e3350d; }
        .palmares-card span { font-size: 1.5em; font-weight: bold; color: #fff; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-top">
            <h2>Panel TCG</h2>
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">📊 Partidas</a>
                <a href="torneos.html" class="nav-link">🏆 Torneos</a>
                <a href="equipo.html" class="nav-link">👥 Miembros</a>
                <a href="perfil.html" class="nav-link active">👤 Mi Perfil</a>
            </div>
        </div>
        <div class="sidebar-bottom">
            <a href="configuracion.html" class="nav-link" style="padding: 10px 15px; border-radius: 6px; text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 10px;">⚙️ Configuración</a>
            <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </div>

    <datalist id="lista-mazos-meta"></datalist>

    <div class="main-content">
        <!-- Cabecera del Perfil -->
        <div class="profile-header">
            <div id="avatar-container">
                <div class="avatar-preview" id="avatar-placeholder">👤</div>
            </div>
            <div class="profile-info">
                <h2 id="user-nombre">Cargando perfil...</h2>
                <p id="user-email">...</p>
            </div>
        </div>

        <!-- Subpestañas -->
        <div class="profile-tabs">
            <button class="tab-btn active" onclick="cambiarPestana('palmares', event)">🏆 Mi Palmarés</button>
            <button class="tab-btn" onclick="cambiarPestana('live', event)">🔴 Torneos en Vivo</button>
        </div>

        <!-- Pestaña 1: Palmarés y Estadísticas Personales -->
        <div id="tab-palmares" class="tab-content active">
            <div class="card">
                <h3 style="margin-top:0;">Estadísticas y Palmarés</h3>
                <div class="palmares-grid">
                    <div class="palmares-card">
                        <h4>Torneos Apuntados</h4>
                        <span id="stat-torneos-jugados">0</span>
                    </div>
                    <div class="palmares-card">
                        <h4>Victorias Totales</h4>
                        <span id="stat-victorias" style="color:#4dff4d">0</span>
                    </div>
                    <div class="palmares-card">
                        <h4>Win Rate General</h4>
                        <span id="stat-winrate">0%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pestaña 2: Torneos en Vivo -->
        <div id="tab-live" class="tab-content">
            <div class="card">
                <h3 style="margin-top:0;">Torneos en Directo (Modo Live)</h3>
                <div id="contenedor-torneos-live">
                    <p style="color:#aaa;">Cargando tus torneos activos...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://xacmsdklvvturxmabhcn.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhhY21zZGtsdnZ0dXJ4bWFiaGNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3ODY4ODQsImV4cCI6MjEwNDM2Mjg4NH0.Bq9whfVe5Ah7Kz8NUKWTu5lZqGZRzHZSk-5xy3sHmWQ';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let usuarioActual = null;

        const arquetiposBase = [
            "Dragapult", "Mega Excadrill", "Alakazam Dudunsparce", "Festival Lead", 
            "Dragapult Blaziken", "Dragapult Dusknoir", "Slowking", "N's Zoroark", 
            "Grimmsnarl Froslass", "Dhelmise Hide n' Sneak", "Toucannon", "Raging Bolt Ogerpon", 
            "Mega Lucario", "Lucario Hariyama", "Basic Box", "Mega Greninja", 
            "Ogerpon Meganium Hydrapple", "Rocket's Honchkrow", "Cynthia's Garchomp", 
            "Mega Chandelure", "Beedrill", "Crustle", "Mega Absol Box", "Rocket's Mewtwo", 
            "Kangaskhan Bouffalant", "Greninja", "Hop's Trevenant", "Lopunny Dudunsparce", 
            "Manectric Eelektrik", "Starmie Froslass", "Lopunny Dusknoir", "Ethan's Typhlosion", 
            "Toxtricity Box", "Ceruledge", "Dragapult Dudunsparce", "Ogerpon Meganium Arboliva", 
            "Mega Venusaur", "Mega Darkrai", "Starmie Dusknoir", "Mega Starmie", "Cinccino", 
            "Sharpedo Toxtricity", "Steven's Metagross", "Alakazam Dusknoir", "Toxtricity", 
            "Blaziken Zoroark", "Clefairy Ogerpon", "Okidogi Barbaracle", "Froslass Munkidori", 
            "Lillie's Clefairy", "Mega Froslass", "Mega Abomasnow", "Mega Charizard X", 
            "Metagross", "Flareon Noctowl", "Hydreigon", "Mega Dragonite", "Diancie Dusknoir", 
            "Doublade", "Wailord", "Tera Box", "Hop's Zacian", "Marnie's Grimmsnarl", 
            "Erika's Victreebel", "Froslass Dudunsparce", "Zygarde Barbaracle", "Ogerpon Meganium", 
            "Iron Thorns", "Seaking Festival Lead", "Palafin", "Bronzong", "Iono's Bellibolt", 
            "Ursaluna Lunatone", "Azumarill", "Archaludon"
        ];

        async function comprobarAutenticacion() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { window.location.href = "index.html"; } 
            else { 
                usuarioActual = user; 
                cargarDatosPerfil(); 
                cargarTorneosLive();
                cargarDatalistMazos();

                // Detección automática de la subpestaña live por URL
                if (window.location.hash === '#live') {
                    const btnLive = document.querySelectorAll('.tab-btn')[1];
                    if (btnLive) {
                        cambiarPestana('live', { currentTarget: btnLive });
                    }
                }
            }
        }
        comprobarAutenticacion();

        async function cerrarSesion() {
            await supabaseClient.auth.signOut();
            window.location.href = "index.html";
        }

        function cambiarPestana(pestana, evento) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${pestana}`).classList.add('active');
            evento.currentTarget.classList.add('active');
        }

        async function cargarDatosPerfil() {
            document.getElementById('user-email').innerText = usuarioActual.email;
            
            const { data: perfil } = await supabaseClient.from('perfiles').select('*').eq('id', usuarioActual.id).single();
            const nombreDefault = usuarioActual.email.split('@')[0];
            
            if (perfil) {
                document.getElementById('user-nombre').innerText = perfil.nombre_usuario || nombreDefault;
                if (perfil.avatar_url) {
                    document.getElementById('avatar-container').innerHTML = `<img src="${perfil.avatar_url}" class="avatar-preview">`;
                }
            } else {
                document.getElementById('user-nombre').innerText = nombreDefault;
            }

            const { data: partidas } = await supabaseClient.from('matchups').select('*').eq('id_jugador', usuarioActual.id);
            if (partidas) {
                const total = partidas.length;
                const victorias = partidas.filter(p => p.resultado === 'Victoria').length;
                const wr = total ? Math.round((victorias / total) * 100) : 0;
                
                document.getElementById('stat-victorias').innerText = victorias;
                document.getElementById('stat-winrate').innerText = `${wr}%`;
            }

            const { data: asistencias } = await supabaseClient.from('asistencias').select('*').eq('id_jugador', usuarioActual.id);
            if (asistencias) {
                document.getElementById('stat-torneos-jugados').innerText = asistencias.length;
            }
        }

        async function cargarDatalistMazos() {
            const datalist = document.getElementById('lista-mazos-meta');
            const { data } = await supabaseClient.from('matchups').select('tu_baraja, baraja_rival');
            const mazos = new Set(arquetiposBase);
            if (data) data.forEach(p => { if (p.tu_baraja) mazos.add(p.tu_baraja.trim()); });
            datalist.innerHTML = "";
            mazos.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                datalist.appendChild(opt);
            });
        }

        async function cargarTorneosLive() {
            const contenedor = document.getElementById('contenedor-torneos-live');
            
            const { data: asistencias, error: errAsist } = await supabaseClient
                .from('asistencias')
                .select('id_evento, mazo_previsto')
                .eq('id_jugador', usuarioActual.id);

            if (errAsist || !asistencias || asistencias.length === 0) {
                contenedor.innerHTML = "<p style='color:#aaa;'>No estás apuntado a ningún torneo actualmente. Apúntate desde el calendario de la pestaña de Torneos.</p>";
                return;
            }

            const idsEventos = asistencias.map(a => a.id_evento);
            const mapaMazos = {};
            asistencias.forEach(a => { mapaMazos[a.id_evento] = a.mazo_previsto; });

            const { data: eventos, error: errEv } = await supabaseClient
                .from('eventos')
                .select('*')
                .in('id', idsEventos)
                .order('fecha_evento', { ascending: true });

            if (errEv || !eventos || eventos.length === 0) {
                contenedor.innerHTML = "<p style='color:#aaa;'>No hay torneos activos programados.</p>";
                return;
            }

            contenedor.innerHTML = "";
            eventos.forEach(ev => {
                const mazoPropio = mapaMazos[ev.id] || '';
                const card = document.createElement('div');
                card.className = 'live-tournament-card';
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <div>
                            <h4 style="margin:0 0 4px 0; font-size:1.1em; color:#fff;">📅 ${ev.nombre_torneo}</h4>
                            <span style="font-size:0.85em; color:#aaa;">📍 ${ev.lugar || 'Por definir'} | 🗓️ ${ev.fecha_evento} (${ev.formato})</span>
                        </div>
                        <span class="badge-live">Modo Live Activo</span>
                    </div>
                    <div style="background:#1e1e1e; padding:15px; border-radius:6px; margin-top:10px;">
                        <p style="margin:0 0 10px 0; font-size:0.9em; font-weight:bold; color:#ccc;">Tu mazo registrado: <span style="color:#e3350d;">${mazoPropio || 'Sin mazo definido'}</span></p>
                        
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                                <select id="live-ronda-${ev.id}" style="padding: 8px; font-size:0.85em; flex:1; min-width:110px;">
                                    <option value="Ronda 1">Ronda 1</option>
                                    <option value="Ronda 2">Ronda 2</option>
                                    <option value="Ronda 3">Ronda 3</option>
                                    <option value="Ronda 4">Ronda 4</option>
                                    <option value="Ronda 5">Ronda 5</option>
                                    <option value="Ronda 6">Ronda 6</option>
                                    <option value="Top Cut">Top Cut</option>
                                </select>
                                <select id="live-resultado-${ev.id}" style="padding: 8px; font-size:0.85em; flex:1; min-width:110px;">
                                    <option value="Victoria">Victoria</option>
                                    <option value="Derrota">Derrota</option>
                                    <option value="Empate">Empate</option>
                                </select>
                                <select id="live-turno-${ev.id}" style="padding: 8px; font-size:0.85em; flex:1; min-width:110px;">
                                    <option value="true">Empiezo (1º)</option>
                                    <option value="false">Segundo (2º)</option>
                                </select>
                            </div>
                            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 5px;">
                                <input type="text" id="live-rival-${ev.id}" list="lista-mazos-meta" placeholder="Mazo del rival..." autocomplete="off" style="padding: 8px; font-size:0.85em; margin:0; flex:1; min-width:140px;">
                                <input type="text" id="live-notas-${ev.id}" placeholder="Notas rápidas..." style="padding: 8px; font-size:0.85em; margin:0; flex:1.5; min-width:140px;">
                                <button onclick="registrarRondaLive(${ev.id}, '${mazoPropio}', '${ev.formato}')" style="margin:0; padding: 8px 15px; width:auto; font-size:0.85em;">Registrar Ronda</button>
                            </div>
                        </div>
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        async function registrarRondaLive(idEvento, mazoPropio, formatoTorneo) {
            const ronda = document.getElementById(`live-ronda-${idEvento}`).value;
            const resultado = document.getElementById(`live-resultado-${idEvento}`).value;
            const empiezaTu = document.getElementById(`live-turno-${idEvento}`).value === 'true';
            const mazoRival = document.getElementById(`live-rival-${idEvento}`).value.trim();
            const notas = document.getElementById(`live-notas-${idEvento}`).value.trim();

            if (!mazoPropio) {
                alert("Debes definir tu mazo en la sección de asistencia del calendario de torneos antes de registrar partidas.");
                return;
            }
            if (!mazoRival) {
                alert("Introduce el mazo del rival.");
                return;
            }

            const { error } = await supabaseClient.from('matchups').insert([{
                id_jugador: usuarioActual.id,
                tu_baraja: mazoPropio,
                baraja_rival: mazoRival,
                resultado: resultado,
                empiezas_tu: empiezaTu,
                formato: formatoTorneo || 'Bo1',
                ronda_suiza: ronda,
                notas: notas ? `[Torneo Live] ${notas}` : '[Torneo Live]'
            }]);

            if (error) {
                alert("Error al registrar la ronda.");
            } else {
                alert(`¡${ronda} registrada con éxito! Ya se ha sumado a tu palmarés y al metajuego global.`);
                document.getElementById(`live-rival-${idEvento}`).value = '';
                document.getElementById(`live-notas-${idEvento}`).value = '';
                cargarDatosPerfil();
            }
        }
    </script>
</body>
</html>
