<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - Equipo y Metajuego</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 240px; background-color: #1a1a1a; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #2a2a2a; transition: transform 0.3s ease; z-index: 1000; }
        .sidebar-top { padding: 20px; }
        .sidebar h2 { font-size: 1.1em; color: #e3350d; margin-top: 0; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        .nav-links { display: flex; flex-direction: column; gap: 8px; }
        .nav-link { display: flex; align-items: center; gap: 10px; padding: 12px 15px; color: #aaa; text-decoration: none; border-radius: 6px; font-weight: bold; transition: all 0.2s; }
        .nav-link:hover { background-color: #2a2a2a; color: white; }
        .nav-link.active { background-color: #e3350d; color: white; }
        .sidebar-bottom { padding: 20px; border-top: 1px solid #2a2a2a; display: flex; flex-direction: column; gap: 8px; }

        .mobile-header { display: none; position: fixed; top: 0; left: 0; right: 0; box-sizing: border-box; background: #1a1a1a; padding: 15px 20px; border-bottom: 1px solid #2a2a2a; align-items: center; justify-content: space-between; z-index: 99; }
        .hamburger-btn { background: none; border: none; color: white; font-size: 1.5em; cursor: pointer; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 999; }
        
        .main-content { flex: 1; overflow-y: auto; padding: 30px; display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
        .card { background-color: #1e1e1e; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); flex: 1; min-width: 320px; }
        
        .miembro-card { background-color: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; transition: border-color 0.2s; }
        .miembro-card:hover { border-color: #e3350d; }
        .miembro-info h4 { margin: 0; color: #fff; font-size: 1.1em; }
        
        button { padding: 8px 15px; background-color: #e3350d; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; font-size: 0.85em; transition: background-color 0.2s; }
        button:hover { background-color: #b32a0a; }
        .btn-logout { width: 100%; background-color: #333; padding: 10px; font-size: 0.85em; border: none; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; text-align: center; }
        .btn-logout:hover { background-color: #444; }

        .winrate-container { width: 100%; background-color: #2a2a2a; border-radius: 8px; height: 12px; display: flex; overflow: hidden; margin-bottom: 10px; }
        .bar-win { background-color: #4dff4d; transition: width 0.5s; }
        .bar-loss { background-color: #ff4d4d; transition: width 0.5s; }
        .bar-tie { background-color: #ffcc00; transition: width 0.5s; }
        .stats-text { display: flex; justify-content: space-between; font-size: 0.85em; color: #aaa; margin-bottom: 15px; font-weight: bold; }
        
        .deck-stats-list { margin-bottom: 25px; display: flex; flex-direction: column; gap: 10px; }
        .deck-stat-item { background-color: #2a2a2a; border: 1px solid #333; border-radius: 8px; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        .deck-stat-info { display: flex; align-items: center; gap: 8px; font-weight: bold; }
        .deck-stat-record { font-family: monospace; font-size: 1.1em; }
        
        .matchup-item { background-color: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #333; }
        .matchup-header { display: flex; justify-content: space-between; align-items: center; }
        .mazos-container { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .mazo-display { display: flex; align-items: center; gap: 8px; font-size: 1.1em; font-weight: bold; background-color: #1e1e1e; padding: 5px 12px; border-radius: 20px; }
        
        .sprites-wrapper { display: flex; align-items: center; margin-right: 5px; }
        .pkmn-sprite { width: 35px; height: 35px; object-fit: contain; margin-left: -8px; background: rgba(255,255,255,0.05); border-radius: 50%; padding: 2px; }
        .pkmn-sprite:first-child { margin-left: 0; }
        
        .vs-text { color: #aaa; font-weight: normal; font-size: 0.9em; font-style: italic; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75em; font-weight: bold; text-transform: uppercase; }
        .badge-victoria { background-color: rgba(77, 255, 77, 0.2); color: #4dff4d; border: 1px solid #4dff4d; }
        .badge-derrota { background-color: rgba(255, 77, 77, 0.2); color: #ff4d4d; border: 1px solid #ff4d4d; }
        .badge-empate { background-color: rgba(255, 204, 0, 0.2); color: #ffcc00; border: 1px solid #ffcc00; }
        .badge-turno { background-color: rgba(52, 152, 219, 0.2); color: #3498db; border: 1px solid #3498db; }
        .badge-ronda { background-color: rgba(155, 89, 182, 0.2); color: #9b59b6; border: 1px solid #9b59b6; }
        .badge-formato { background-color: rgba(230, 126, 34, 0.2); color: #e67e22; border: 1px solid #e67e22; }
        .badge-secuencia { background-color: rgba(46, 204, 113, 0.2); color: #2ecc71; font-family: monospace; }
        .notas { font-size: 0.85em; color: #ccc; background-color: #1e1e1e; padding: 10px; border-radius: 6px; margin: 0; border-left: 3px solid #555; }

        .meta-row { background-color: #2a2a2a; border: 1px solid #333; border-radius: 8px; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .meta-info { display: flex; align-items: center; gap: 10px; font-weight: bold; }

        @media (max-width: 768px) {
            body { flex-direction: column; overflow: auto; height: auto; }
            .sidebar { position: fixed; top: 0; left: -240px; height: 100%; width: 240px; }
            .sidebar.open { transform: translateX(240px); }
            .mobile-header { display: flex !important; }
            .sidebar-overlay.open { display: block; }
            .main-content { padding: 15px; height: auto; margin-top: 60px !important; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
    
    <div class="mobile-header">
        <span style="font-weight: bold; color: #e3350d; font-size: 1.1em; letter-spacing: 1px;">PANEL TCG</span>
        <button class="hamburger-btn" onclick="toggleSidebar()">☰</button>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <h2>Panel TCG</h2>
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">📊 Partidas</a>
                <a href="torneos.html" class="nav-link">🏆 Torneos</a>
                <a href="equipo.html" class="nav-link active">👥 Miembros</a>
                <a href="perfil.html" class="nav-link">👤 Mi Perfil</a>
            </div>
        </div>
        <div class="sidebar-bottom">
            <a href="configuracion.html" class="nav-link" style="padding: 10px 15px; border-radius: 6px; text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 10px;">⚙️ Configuración</a>
            <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </div>

    <div class="main-content">
        <div class="card" style="flex: 0.8;">
            <h3 style="margin-top:0;">Equipo</h3>
            <button onclick="verMetajuegoGlobal()" style="width:100%; margin-bottom:20px; background-color:#333; border: 1px solid #555;">🌐 Ver Metajuego Global</button>
            
            <h4 style="color:#aaa; font-size:0.85em; text-transform:uppercase; margin-bottom:10px;">Compañeros:</h4>
            <div id="lista-miembros">
                <p style="color: #aaa;">Cargando miembros...</p>
            </div>
        </div>

        <div class="card" style="flex: 1.5;">
            <h3 id="titulo-panel-principal" style="margin-top:0;">Metajuego Global del Equipo</h3>
            
            <div class="winrate-container">
                <div id="bar-w" class="bar-win" style="width: 0%;"></div>
                <div id="bar-t" class="bar-tie" style="width: 0%;"></div>
                <div id="bar-l" class="bar-loss" style="width: 0%;"></div>
            </div>
            <div class="stats-text">
                <span id="stat-w" style="color:#4dff4d">0% Victorias</span>
                <span id="stat-t" style="color:#ffcc00">0% Empates</span>
                <span id="stat-l" style="color:#ff4d4d">0% Derrotas</span>
            </div>

            <div id="contenedor-dinamico-contenido"></div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://xacmsdklvvturxmabhcn.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhhY21zZGtsdnZ0dXJ4bWFiaGNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3ODY4ODQsImV4cCI6MjEwNDM2Mjg4NH0.Bq9whfVe5Ah7Kz8NUKWTu5lZqGZRzHZSk-5xy3sHmWQ';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function comprobarAutenticacion() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { window.location.href = "index.html"; } 
            else { 
                cargarMiembros();
                verMetajuegoGlobal();
            }
        }
        comprobarAutenticacion();

        async function cerrarSesion() {
            await supabaseClient.auth.signOut();
            window.location.href = "index.html";
        }

        const diccionarioArquetipos = {
            "raging bolt ogerpon": ["ragingbolt", "ogerpon"],
            "raging bolt": ["ragingbolt"],
            "iron thorns": ["ironthorns"],
            "basic box": ["ogerpon", "clefairy"],
            "festival lead": ["dipplin", "thwackey"],
            "dhelmise hide n' sneak": ["dhelmise", "banette"],
            "seaking festival lead": ["seaking", "thwackey"],
            "toxtricity box": ["toxtricity", "absol"],
            "mega absol box": ["absol", "kangaskhan"],
            "rocket's mewtwo": ["mewtwo", "spidops"],
            "tera box": ["terapagos", "ogerpon"],
            "marnie's grimmsnarl": ["grimmsnarl", "froslass"],
            "grimmsnarl froslass": ["grimmsnarl", "froslass"]
        };

        function generarSpritesHtml(textoMazo) {
            if (!textoMazo) return "";
            let textoMin = textoMazo.toLowerCase().trim();
            let listaPokemons = [];

            if (diccionarioArquetipos[textoMin]) {
                listaPokemons = diccionarioArquetipos[textoMin];
            } else {
                let limpio = textoMin;
                limpio = limpio.replace(/\b(ex|v|vmax|vstar|gx|box|deck|hand|inspire|lead|inn|sneak|surge|mega|n's|rocket's|hop's|cynthia's|steven's|marnie's|erika's|lillie's)\b/g, '');
                limpio = limpio.replace(/['’]s/g, ''); 
                let palabras = limpio.split(/\s+/).filter(p => p.length > 2);
                listaPokemons = palabras.slice(0, 2);
                if (listaPokemons.length === 0 && textoMin.length > 0) {
                    listaPokemons = [textoMin.replace(/[^a-z]/g, '')];
                }
            }

            let html = "";
            listaPokemons.forEach(pkmn => {
                const cleanName = pkmn.replace(/[^a-z]/g, '');
                if (cleanName) {
                    html += `<img src="https://play.pokemonshowdown.com/sprites/dex/${cleanName}.png" class="pkmn-sprite" onerror="this.style.display='none'" title="${cleanName}">`;
                }
            });
            return html;
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        async function cargarMiembros() {
            const contenedor = document.getElementById('lista-miembros');
            const { data, error } = await supabaseClient.from('matchups').select('id_jugador');

            if (error || !data) {
                contenedor.innerHTML = "<p style='color:#ff4d4d;'>Error al cargar miembros.</p>";
                return;
            }

            const idsUnicos = [...new Set(data.map(item => item.id_jugador))];
            const { data: perfiles } = await supabaseClient.from('perfiles').select('*');
            const mapaPerfiles = {};
            if (perfiles) perfiles.forEach(p => { mapaPerfiles[p.id] = p; });

            contenedor.innerHTML = "";
            idsUnicos.forEach((idJugador, index) => {
                const perfil = mapaPerfiles[idJugador];
                const nombreMostrar = perfil && perfil.nombre_usuario ? perfil.nombre_usuario : `Jugador #${index + 1}`;
                const avatarUrl = perfil && perfil.avatar_url ? perfil.avatar_url : null;

                const card = document.createElement('div');
                card.className = 'miembro-card';
                card.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 10px;">
                        ${avatarUrl ? `<img src="${avatarUrl}" style="width:35px; height:35px; border-radius:50%; object-fit:cover; border: 2px solid #e3350d;">` : `<div style="width:35px; height:35px; border-radius:50%; background:#333; display:flex; align-items:center; justify-content:center; border: 2px solid #555;">👤</div>`}
                        <div class="miembro-info">
                            <h4 style="font-size:0.95em;">${nombreMostrar}</h4>
                        </div>
                    </div>
                    <button onclick="verEstadisticasMiembro('${idJugador}', '${nombreMostrar}')">Ver</button>
                `;
                contenedor.appendChild(card);
            });
        }

        async function verMetajuegoGlobal() {
            document.getElementById('titulo-panel-principal').innerText = "Metajuego Global del Equipo";
            const contenedor = document.getElementById('contenedor-dinamico-contenido');
            contenedor.innerHTML = "<p style='color:#aaa;'>Calculando estadísticas globales...</p>";

            const { data: todasPartidas, error } = await supabaseClient.from('matchups').select('*');

            if (error || !todasPartidas) {
                contenedor.innerHTML = "<p style='color:#ff4d4d;'>Error al cargar el metajuego global.</p>";
                return;
            }

            actualizarEstadisticas(todasPartidas);

            if (todasPartidas.length === 0) {
                contenedor.innerHTML = "<p style='color:#aaa;'>No hay partidas registradas en el equipo todavía.</p>";
                return;
            }

            const metaRival = {};
            todasPartidas.forEach(p => {
                const rival = p.baraja_rival ? p.baraja_rival.trim() : "Desconocido";
                if (!metaRival[rival]) metaRival[rival] = { w: 0, l: 0, t: 0, total: 0 };
                metaRival[rival].total++;
                if (p.resultado === "Victoria") metaRival[rival].w++;
                if (p.resultado === "Derrota") metaRival[rival].l++;
                if (p.resultado === "Empate") metaRival[rival].t++;
            });

            const arrayMeta = Object.entries(metaRival).sort((a, b) => b[1].total - a[1].total);
            let html = `<h3 style="border-top: 1px solid #333; padding-top: 15px; margin-bottom: 15px; font-size:1em; color:#aaa; text-transform:uppercase;">Rendimiento del equipo contra arquetipos rivales:</h3>`;
            
            arrayMeta.forEach(([mazoRival, stats]) => {
                const spritesHtml = generarSpritesHtml(mazoRival);
                const winRate = Math.round((stats.w / stats.total) * 100);
                let colorWr = "#4dff4d";
                if (winRate < 45) colorWr = "#ff4d4d";
                else if (winRate < 55) colorWr = "#ffcc00";

                html += `
                    <div class="meta-row">
                        <div class="meta-info">
                            <div class="sprites-wrapper">${spritesHtml}</div>
                            <span>${mazoRival}</span>
                            <span style="font-size:0.75em; color:#777; font-weight:normal; margin-left:5px;">(${stats.total} partidas)</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <span style="font-weight:bold; color:${colorWr};">${winRate}% WR</span>
                            <span style="font-family:monospace; font-size:0.95em; color:#ccc;">${stats.w}V - ${stats.l}D - ${stats.t}E</span>
                        </div>
                    </div>
                `;
            });

            contenedor.innerHTML = html;
        }

        async function verEstadisticasMiembro(idJugador, nombreJugador) {
            document.getElementById('titulo-panel-principal').innerText = `Estadísticas de ${nombreJugador}`;
            const contenedor = document.getElementById('contenedor-dinamico-contenido');
            contenedor.innerHTML = "<p style='color:#aaa;'>Cargando partidas...</p>";

            const { data, error } = await supabaseClient
                .from('matchups')
                .select('*')
                .eq('id_jugador', idJugador)
                .order('creado_en', { ascending: false });

            if (error) {
                contenedor.innerHTML = "<p style='color:#ff4d4d;'>Error al cargar datos.</p>";
                return;
            }

            actualizarEstadisticas(data);

            if (data.length === 0) {
                contenedor.innerHTML = "<p style='color:#aaa;'>Este miembro aún no tiene partidas.</p>";
                return;
            }

            let html = `<h3 style="border-top: 1px solid #333; padding-top: 15px; margin-bottom: 15px; font-size:1em; color:#aaa; text-transform:uppercase;">Desglose por Mazo del Jugador:</h3><div class="deck-stats-list">`;
            
            const statsMazos = {};
            data.forEach(p => {
                if (!statsMazos[p.tu_baraja]) statsMazos[p.tu_baraja] = { w: 0, l: 0, t: 0, jugadas: 0 };
                statsMazos[p.tu_baraja].jugadas++;
                if(p.resultado === "Victoria") statsMazos[p.tu_baraja].w++;
                if(p.resultado === "Derrota") statsMazos[p.tu_baraja].l++;
                if(p.resultado === "Empate") statsMazos[p.tu_baraja].t++;
            });

            Object.entries(statsMazos).sort((a, b) => b[1].jugadas - a[1].jugadas).forEach(([mazo, st]) => {
                html += `
                    <div class="deck-stat-item">
                        <div class="deck-stat-info"><div class="sprites-wrapper">${generarSpritesHtml(mazo)}</div> <span>${mazo}</span></div>
                        <div class="deck-stat-record">${st.w}V - ${st.l}D - ${st.t}E</div>
                    </div>
                `;
            });
            html += `</div>`;

            html += `<h3 style="border-top: 1px solid #333; padding-top: 15px; margin-bottom: 15px; font-size:1em; color:#aaa; text-transform:uppercase;">Historial de Partidas:</h3>`;
            
            data.forEach(partida => {
                let claseResultado = `badge-${partida.resultado.toLowerCase()}`;
                const ordenTurno = partida.empiezas_tu ? 'Fui 1º' : 'Fui 2º';
                let htmlRonda = partida.ronda_suiza ? `<span class="badge badge-ronda">🏆 ${partida.ronda_suiza}</span>` : '';
                let htmlNotas = partida.notas ? `<p class="notas">📝 ${partida.notas}</p>` : '';
                let htmlFormato = partida.formato === 'Bo3' && partida.secuencia_bo3 
                    ? `<span class="badge badge-secuencia">Bo3: ${partida.secuencia_bo3}</span>` 
                    : `<span class="badge badge-formato">Bo1</span>`;

                html += `
                    <div class="matchup-item">
                        <div class="matchup-header">
                            <div class="mazos-container">
                                <div class="mazo-display"><div class="sprites-wrapper">${generarSpritesHtml(partida.tu_baraja)}</div> <span>${partida.tu_baraja}</span></div>
                                <span class="vs-text">VS</span>
                                <div class="mazo-display"><div class="sprites-wrapper">${generarSpritesHtml(partida.baraja_rival)}</div> <span>${partida.baraja_rival}</span></div>
                            </div>
                        </div>
                        <div style="display:flex; gap:8px; flex-wrap:wrap;">
                            <span class="badge ${claseResultado}">${partida.resultado}</span>
                            ${htmlFormato}
                            <span class="badge badge-turno">⏱️ ${ordenTurno}</span>
                            ${htmlRonda}
                        </div>
                        ${htmlNotas}
                    </div>
                `;
            });

            contenedor.innerHTML = html;
        }

        function actualizarEstadisticas(partidas) {
            let w = 0, l = 0, t = 0;
            partidas.forEach(p => {
                if(p.resultado === "Victoria") w++;
                else if(p.resultado === "Derrota") l++;
                else t++;
            });
            const total = partidas.length;
            const pw = total ? Math.round((w / total) * 100) : 0;
            const pt = total ? Math.round((t / total) * 100) : 0;
            const pl = total ? Math.round((l / total) * 100) : 0;

            document.getElementById('bar-w').style.width = `${pw}%`;
            document.getElementById('bar-t').style.width = `${pt}%`;
            document.getElementById('bar-l').style.width = `${pl}%`;

            document.getElementById('stat-w').innerText = `${pw}% Victorias (${w})`;
            document.getElementById('stat-t').innerText = `${pt}% Empates (${t})`;
            document.getElementById('stat-l').innerText = `${pl}% Derrotas (${l})`;
        }
    </script>
</body>
</html>
