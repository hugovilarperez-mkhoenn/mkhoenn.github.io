<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - Torneos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 240px; background-color: #1a1a1a; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #2a2a2a; }
        .sidebar-top { padding: 20px; }
        .sidebar h2 { font-size: 1.1em; color: #e3350d; margin-top: 0; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        .nav-links { display: flex; flex-direction: column; gap: 8px; }
        .nav-link { display: flex; align-items: center; gap: 10px; padding: 12px 15px; color: #aaa; text-decoration: none; border-radius: 6px; font-weight: bold; transition: all 0.2s; }
        .nav-link:hover { background-color: #2a2a2a; color: white; }
        .nav-link.active { background-color: #e3350d; color: white; }
        .sidebar-bottom { padding: 20px; border-top: 1px solid #2a2a2a; display: flex; flex-direction: column; gap: 8px; }
        
        .main-content { flex: 1; overflow-y: auto; padding: 30px; display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
        .card { background-color: #1e1e1e; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); flex: 1; min-width: 320px; }
        
        label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: bold; font-size: 0.85em; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 6px; box-sizing: border-box; background-color: #2a2a2a; color: white; font-family: inherit; transition: border-color 0.3s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #e3350d; }
        
        button { width: 100%; padding: 12px; background-color: #e3350d; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px; transition: background-color 0.2s; }
        button:hover { background-color: #b32a0a; }
        .btn-logout { width: 100%; background-color: #333; padding: 10px; font-size: 0.85em; border: none; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; text-align: center; }
        .btn-logout:hover { background-color: #444; }

        .calendar-container { background-color: #2a2a2a; border-radius: 8px; padding: 15px; border: 1px solid #333; margin-bottom: 20px; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; font-size: 1.05em; }
        .calendar-header button { background: #333; border: none; color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin: 0; width: auto; font-size: 0.9em; }
        .calendar-header button:hover { background: #e3350d; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .calendar-day-name { font-size: 0.75em; color: #aaa; text-transform: uppercase; padding-bottom: 5px; }
        .calendar-day { padding: 10px 0; background-color: #1e1e1e; border-radius: 4px; font-size: 0.9em; color: #ddd; position: relative; min-height: 20px; }
        .calendar-day.empty { background-color: transparent; }
        .calendar-day.has-event { background-color: rgba(227, 53, 13, 0.2); border: 1px solid #e3350d; color: #fff; font-weight: bold; }
        .event-dot { width: 6px; height: 6px; background-color: #e3350d; border-radius: 50%; margin: 2px auto 0 auto; }

        .torneo-item { background-color: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
        .torneo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .torneo-titulo { font-size: 1.2em; font-weight: bold; margin: 0; color: #fff; }
        .asistentes-box { background-color: #1e1e1e; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 0.9em; }
        .asistente-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #2a2a2a; align-items: center; }
        .asistente-row:last-child { border-bottom: none; }

        .sprites-wrapper { display: flex; align-items: center; margin-right: 5px; }
        .pkmn-sprite { width: 30px; height: 30px; object-fit: contain; margin-left: -8px; background: rgba(255,255,255,0.05); border-radius: 50%; padding: 2px; }
        .pkmn-sprite:first-child { margin-left: 0; }
        .asistente-info { display: flex; align-items: center; gap: 8px; }

        .icon-btn-delete { background: rgba(255, 77, 77, 0.1); border: 1px solid rgba(255, 77, 77, 0.3); font-size: 1.1em; cursor: pointer; padding: 6px 10px; border-radius: 6px; margin: 0; width: auto; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .icon-btn-delete:hover { background: rgba(255, 77, 77, 0.3); transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-top">
            <h2>Panel TCG</h2>
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">📊 Partidas</a>
                <a href="torneos.html" class="nav-link active">🏆 Torneos</a>
                <a href="equipo.html" class="nav-link">👥 Miembros</a>
                <a href="perfil.html" class="nav-link">👤 Mi Perfil</a>
            </div>
        </div>
        <div class="sidebar-bottom">
            <a href="configuracion.html" class="nav-link" style="padding: 10px 15px; border-radius: 6px; text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 10px;">⚙️ Configuración</a>
            <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </div>

    <datalist id="lista-mazos-meta"></datalist>

    <div class="main-content">
        <div class="card" style="flex: 0.9;">
            <h3 style="margin-top:0;">Calendario de Torneos</h3>
            
            <div class="calendar-container">
                <div class="calendar-header">
                    <button onclick="cambiarMes(-1)">◀</button>
                    <span id="mes-anio-label">Mes Año</span>
                    <button onclick="cambiarMes(1)">▶</button>
                </div>
                <div class="calendar-grid" id="grid-calendario"></div>
            </div>

            <h3 style="margin-top:20px;">Crear Nuevo Torneo</h3>
            <form id="formTorneo">
                <label for="nombre_torneo">Nombre del Torneo</label>
                <input type="text" id="nombre_torneo" placeholder="Ej: Regional Ferrol / Local Shop" required>

                <label for="fecha_evento">Fecha</label>
                <input type="date" id="fecha_evento" required>

                <label for="formato_torneo">Formato</label>
                <select id="formato_torneo">
                    <option value="Standard">Standard</option>
                    <option value="Expanded">Expanded</option>
                </select>

                <label for="lugar">Lugar / Tienda</label>
                <input type="text" id="lugar" placeholder="Ej: Comics Store Ferrol">

                <button type="submit">Publicar Torneo</button>
                <div id="mensajeTorneo" style="margin-top:10px; text-align:center; font-size:0.9em;"></div>
            </form>
        </div>

        <div class="card" style="flex: 1.4;">
            <h3 style="margin-top:0;">Próximos Torneos y Asistencias</h3>
            <div id="lista-torneos">
                <p style="color: #aaa;">Cargando torneos...</p>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://xacmsdklvvturxmabhcn.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhhY21zZGtsdnZ0dXJ4bWFiaGNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3ODY4ODQsImV4cCI6MjEwNDM2Mjg4NH0.Bq9whfVe5Ah7Kz8NUKWTu5lZqGZRzHZSk-5xy3sHmWQ';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let usuarioActual = null;
        let fechaActualCalendario = new Date();
        let listaGlobalEventos = [];

        const arquetiposBase = [
            "Dragapult", "Mega Excadrill", "Alakazam Dudunsparce", "Festival Lead", 
            "Dragapult Blaziken", "Dragapult Dusknoir", "Slowking", "N's Zoroark", 
            "Grimmsnarl Froslass", "Dhelmise Hide n' Sneak", "Toucannon", "Raging Bolt Ogerpon", 
            "Mega Lucario", "Lucario Hariyama", "Basic Box", "Mega Greninja", 
            "Ogerpon Meganium Hydrapple", "Rocket's Honchkrow", "Cynthia's Garchomp", 
            "Mega Chandelure", "Beedrill", "Crustle", "Mega Absol Box", "Rocket's Mewtwo", 
            "Kangaskhan Bouffalant", "Greninja", "Hop's Trevenant", "Lopunny Dudunsparce", 
            "Manectric Eelektrik", "Starmie Froslass", "Lopunny Dusknoir", "Ethan's Typhlosion", 
            "Toxtricity Box", "Ceruledge", "Dragapult Dudunsparce", "Ogerpon Meganium Arboliva", 
            "Mega Venusaur", "Mega Darkrai", "Starmie Dusknoir", "Mega Starmie", "Cinccino", 
            "Sharpedo Toxtricity", "Steven's Metagross", "Alakazam Dusknoir", "Toxtricity", 
            "Blaziken Zoroark", "Clefairy Ogerpon", "Okidogi Barbaracle", "Froslass Munkidori", 
            "Lillie's Clefairy", "Mega Froslass", "Mega Abomasnow", "Mega Charizard X", 
            "Metagross", "Flareon Noctowl", "Hydreigon", "Mega Dragonite", "Diancie Dusknoir", 
            "Doublade", "Wailord", "Tera Box", "Hop's Zacian", "Marnie's Grimmsnarl", 
            "Erika's Victreebel", "Froslass Dudunsparce", "Zygarde Barbaracle", "Ogerpon Meganium", 
            "Iron Thorns", "Seaking Festival Lead", "Palafin", "Bronzong", "Iono's Bellibolt", 
            "Ursaluna Lunatone", "Azumarill", "Archaludon"
        ];

        const diccionarioArquetipos = {
            "basic box": ["ogerpon", "clefairy"],
            "festival lead": ["dipplin", "thwackey"],
            "dhelmise hide n' sneak": ["dhelmise", "banette"],
            "seaking festival lead": ["seaking", "thwackey"],
            "toxtricity box": ["toxtricity", "absol"],
            "mega absol box": ["absol", "kangaskhan"],
            "rocket's mewtwo": ["mewtwo", "spidops"],
            "tera box": ["terapagos", "ogerpon"],
            "marnie's grimmsnarl": ["grimmsnarl", "froslass"],
            "grimmsnarl froslass": ["grimmsnarl", "froslass"]
        };

        function generarSpritesHtml(textoMazo) {
            if (!textoMazo) return "";
            let textoMin = textoMazo.toLowerCase().trim();
            let listaPokemons = [];

            if (diccionarioArquetipos[textoMin]) {
                listaPokemons = diccionarioArquetipos[textoMin];
            } else {
                let limpio = textoMin;
                limpio = limpio.replace(/\b(ex|v|vmax|vstar|gx|box|deck|hand|inspire|lead|inn|sneak|surge|mega|n's|rocket's|hop's|cynthia's|steven's|marnie's|erika's|lillie's)\b/g, '');
                limpio = limpio.replace(/['’]s/g, ''); 
                let palabras = limpio.split(/\s+/).filter(p => p.length > 2);
                listaPokemons = palabras.slice(0, 2);
                if (listaPokemons.length === 0 && textoMin.length > 0) {
                    listaPokemons = [textoMin.replace(/[^a-z]/g, '')];
                }
            }

            let html = "";
            listaPokemons.forEach(pkmn => {
                const cleanName = pkmn.replace(/[^a-z]/g, '');
                if (cleanName) {
                    html += `<img src="https://play.pokemonshowdown.com/sprites/dex/${cleanName}.png" class="pkmn-sprite" onerror="this.style.display='none'" title="${cleanName}">`;
                }
            });
            return html;
        }

        async function comprobarAutenticacion() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { window.location.href = "index.html"; } 
            else { usuarioActual = user; cargarTorneos(); }
        }
        comprobarAutenticacion();

        async function cerrarSesion() {
            await supabaseClient.auth.signOut();
            window.location.href = "index.html";
        }

        function cambiarMes(delta) {
            fechaActualCalendario.setMonth(fechaActualCalendario.getMonth() + delta);
            renderizarCalendario();
        }

        function renderizarCalendario() {
            const grid = document.getElementById('grid-calendario');
            const label = document.getElementById('mes-anio-label');
            grid.innerHTML = "";

            const anio = fechaActualCalendario.getFullYear();
            const mes = fechaActualCalendario.getMonth();
            const nombresMeses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            label.innerText = `${nombresMeses[mes]} ${anio}`;

            const diasSemana = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
            diasSemana.forEach(d => {
                const div = document.createElement('div');
                div.className = 'calendar-day-name';
                div.innerText = d;
                grid.appendChild(div);
            });

            const primerDiaDelMes = new Date(anio, mes, 1);
            let diaInicio = primerDiaDelMes.getDay();
            diaInicio = diaInicio === 0 ? 6 : diaInicio - 1;

            const ultimoDiaMes = new Date(anio, mes + 1, 0).getDate();
            const fechasConTorneo = new Set();
            listaGlobalEventos.forEach(ev => {
                if (ev.fecha_evento) fechasConTorneo.add(ev.fecha_evento);
            });

            for (let i = 0; i < diaInicio; i++) {
                const empty = document.createElement('div');
                empty.className = 'calendar-day empty';
                grid.appendChild(empty);
            }

            for (let dia = 1; dia <= ultimoDiaMes; dia++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'calendar-day';
                
                const mesStr = String(mes + 1).padStart(2, '0');
                const diaStr = String(dia).padStart(2, '0');
                const fechaStr = `${anio}-${mesStr}-${diaStr}`;

                dayDiv.innerText = dia;

                if (fechasConTorneo.has(fechaStr)) {
                    dayDiv.classList.add('has-event');
                    const dot = document.createElement('div');
                    dot.className = 'event-dot';
                    dayDiv.appendChild(dot);
                }

                grid.appendChild(dayDiv);
            }
        }

        async function actualizarDatalistDinamico() {
            const datalist = document.getElementById('lista-mazos-meta');
            const { data } = await supabaseClient.from('matchups').select('tu_baraja, baraja_rival');
            
            const mazosPersonalizados = new Set();
            if (data) {
                data.forEach(p => {
                    if (p.tu_baraja) mazosPersonalizados.add(p.tu_baraja.trim());
                    if (p.baraja_rival) mazosPersonalizados.add(p.baraja_rival.trim());
                });
            }
            const setCompleto = new Set([...arquetiposBase, ...mazosPersonalizados]);

            datalist.innerHTML = "";
            setCompleto.forEach(mazo => {
                const option = document.createElement('option');
                option.value = mazo;
                datalist.appendChild(option);
            });
        }

        document.getElementById('formTorneo').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msg = document.getElementById('mensajeTorneo');
            msg.innerText = "Publicando...";

            const { error } = await supabaseClient.from('eventos').insert([{
                nombre_torneo: document.getElementById('nombre_torneo').value.trim(),
                fecha_evento: document.getElementById('fecha_evento').value,
                formato: document.getElementById('formato_torneo').value,
                lugar: document.getElementById('lugar').value.trim()
            }]);

            if (error) {
                msg.style.color = "#ff4d4d";
                msg.innerText = "Error al crear el torneo.";
            } else {
                msg.style.color = "#4dff4d";
                msg.innerText = "¡Torneo publicado!";
                document.getElementById('formTorneo').reset();
                cargarTorneos();
                setTimeout(() => msg.innerText = "", 3000);
            }
        });

        async function cargarTorneos() {
            const contenedor = document.getElementById('lista-torneos');
            await actualizarDatalistDinamico();
            
            const { data: eventos, error: errEventos } = await supabaseClient
                .from('eventos')
                .select('*')
                .order('fecha_evento', { ascending: true });

            if (errEventos) {
                contenedor.innerHTML = "<p style='color: #ff4d4d;'>Error al cargar torneos.</p>";
                return;
            }

            listaGlobalEventos = eventos || [];
            renderizarCalendario();

            if (!listaGlobalEventos.length) {
                contenedor.innerHTML = "<p style='color: #aaa;'>No hay torneos programados.</p>";
                return;
            }

            const { data: asistencias } = await supabaseClient.from('asistencias').select('*');
            contenedor.innerHTML = "";

            listaGlobalEventos.forEach(evento => {
                const item = document.createElement('div');
                item.className = 'torneo-item';

                const listaAsistentes = asistencias ? asistencias.filter(a => a.id_evento === evento.id) : [];
                
                const miAsistencia = listaAsistentes.find(a => a.id_jugador === usuarioActual.id);
                const mazoGuardado = miAsistencia ? (miAsistencia.mazo_previsto || '') : '';
                const estaApuntado = miAsistencia ? true : false;

                let htmlAsistentes = "";
                if (listaAsistentes.length === 0) {
                    htmlAsistentes = "<span style='color:#777; font-size:0.85em;'>Nadie ha confirmado asistencia todavía.</span>";
                } else {
                    listaAsistentes.forEach(asist => {
                        const spritesMazo = generarSpritesHtml(asist.mazo_previsto);
                        
                        // Si el asistente eres tú, enlace directo a tu perfil con la pestaña live activa
                        let htmlNombre = "";
                        if (asist.id_jugador === usuarioActual.id) {
                            htmlNombre = `<a href="perfil.html#live" style="color: #e3350d; text-decoration: none; font-weight: bold;" title="Ir a mis torneos en vivo">👤 ${asist.nombre_jugador || 'Tú'} (Ver Live)</a>`;
                        } else {
                            htmlNombre = `<span style="font-weight:bold; color:#fff;">👤 ${asist.nombre_jugador || 'Compi'}</span>`;
                        }

                        htmlAsistentes += `
                            <div class="asistente-row">
                                ${htmlNombre}
                                <div class="asistente-info">
                                    <div class="sprites-wrapper">${spritesMazo}</div>
                                    <span style="color: #e3350d; font-weight: bold;">${asist.mazo_previsto || 'Sin mazo'}</span>
                                </div>
                            </div>
                        `;
                    });
                }

                item.innerHTML = `
                    <div class="torneo-header">
                        <div>
                            <p class="torneo-titulo">📅 ${evento.nombre_torneo}</p>
                            <span style="font-size: 0.85em; color: #aaa;">📍 ${evento.lugar || 'Por definir'} | 🗓️ ${evento.fecha_evento} (${evento.formato})</span>
                        </div>
                        <button class="icon-btn-delete" onclick="borrarTorneo(${evento.id})" title="Eliminar Torneo">🗑️</button>
                    </div>
                    <div class="asistentes-box">
                        <strong style="display:block; margin-bottom:8px; font-size:0.85em; color:#aaa; text-transform:uppercase;">Asistentes confirmados:</strong>
                        ${htmlAsistentes}
                    </div>
                    <div style="margin-top: 12px; display: flex; gap: 10px; align-items: center;">
                        <select id="estado-asist-${evento.id}" style="padding: 8px; font-size: 0.85em; margin:0; width: 130px;">
                            <option value="Voy" ${estaApuntado ? 'selected' : ''}>Sí voy</option>
                            <option value="No voy" ${!estaApuntado ? 'selected' : ''}>No voy</option>
                        </select>
                        <input type="text" id="mazo-asist-${evento.id}" list="lista-mazos-meta" value="${mazoGuardado}" placeholder="¿Con qué mazo vas?" autocomplete="off" style="padding: 8px; font-size: 0.85em; margin:0; flex:1;">
                        <button onclick="guardarAsistencia(${evento.id})" style="margin: 0; padding: 8px 15px; width: auto; font-size: 0.85em;">Actualizar</button>
                    </div>
                `;
                contenedor.appendChild(item);
            });
        }

        async function guardarAsistencia(idEvento) {
            const estadoAsistencia = document.getElementById(`estado-asist-${idEvento}`).value;
            const mazoPrevisto = document.getElementById(`mazo-asist-${idEvento}`).value.trim();
            const nombreUsuario = usuarioActual.email.split('@')[0];

            if (estadoAsistencia === 'No voy') {
                const { error } = await supabaseClient
                    .from('asistencias')
                    .delete()
                    .eq('id_evento', idEvento)
                    .eq('id_jugador', usuarioActual.id);

                if (!error) cargarTorneos();
                else alert("Error al actualizar la asistencia.");
            } else {
                const { error } = await supabaseClient
                    .from('asistencias')
                    .upsert({
                        id_evento: idEvento,
                        id_jugador: usuarioActual.id,
                        nombre_jugador: nombreUsuario,
                        estado: 'Confirmado',
                        mazo_previsto: mazoPrevisto,
                        actualizado_en: new Date()
                    }, { onConflict: 'id_evento, id_jugador' });

                if (!error) cargarTorneos();
                else alert("Error al actualizar la asistencia.");
            }
        }

        async function borrarTorneo(idEvento) {
            if (!confirm("¿Estás seguro de que quieres eliminar este torneo? Se borrarán también las asistencias asociadas.")) return;

            await supabaseClient.from('asistencias').delete().eq('id_evento', idEvento);
            const { error } = await supabaseClient.from('eventos').delete().eq('id', idEvento);

            if (!error) {
                cargarTorneos();
            } else {
                alert("Error al eliminar el torneo.");
            }
        }
    </script>
</body>
</html>
